/* ---- Słoneczna paleta (domyślna) ---- */

.sun .top{background:linear-gradient(135deg,#FFB547,#FF8A5B)!important;color:#fff}
.sun .top .tbtn{background:#ffffff40!important;color:#fff}
.sun .ttl{font-size:26px;font-weight:900;text-shadow:0 1px 0 #0002}
.sun .card{background:#fff;border-radius:26px;box-shadow:0 6px 18px #FF9F4326}
.sun .b1{background:linear-gradient(135deg,#34C77B,#2BAE9A);color:#fff;font-size:19px}
.sun .b2{background:#FFF0D6;color:#6B3F12}

.sun .h1s{font-size:24px;color:#3B2A1A}.sun .kw{font-size:21px}
.sun .muted{font-size:14px;opacity:.75}.sun .mm{font-size:15px}

.sun .nav button.on,.sun .nav button.act{background:#FFE7A3;border-radius:16px}
.sun .ck{background:#E7F8EE;color:#1E6B43;font-size:16px}
/* ---- kolumna głównych akcji (tablet/desktop: prawa kolumna; telefon: pasek nad menu) ---- */
.rail{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:25;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px;background:#FFFDF6e6;backdrop-filter:blur(6px)}
.rail .rb{height:64px;padding:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px #0003;font-size:13px;line-height:1.05;border:2px solid #fff}

.rail .r1{background:linear-gradient(135deg,#FFB547,#FF8A3D)}.rail .r2{background:linear-gradient(135deg,#FF6F91,#E0475B)}
.rail .r3{background:linear-gradient(135deg,#34C77B,#1FA463)}.rail .r4{background:linear-gradient(135deg,#4DA3FF,#3366E6)}
.rail .rb.on{outline:4px solid #3B2A1A;outline-offset:1px}

const DK={meal:['Posiłek','meal'],nap:['Drzemka','nap'],toilet:['Toaleta','toilet'],mood:['Nastrój','mood'],temp:['Temp.','temp'],out:['Dwór','out'],note:['Notatka','note']};
const MEALS=[['sn','Śniadanie'],['ob','Obiad'],['pw','Podwieczorek']],PORT=[['4','Całość','🟢'],['2','Połowa','🟡'],['1','Trochę','🟠'],['0','Nic','⚪']];
const TOI=[['siku','Siku'],['kupka','Kupka'],['sucha','Sucha pieluszka'],['nocnik','Nocnik ✓']];
const dcOf=(id,day=todayStr())=>(DB.test_daycard||[]).filter(e=>e.child_id===id&&e.day===day).sort((a,b)=>a.at<b.at?-1:1);
const napOpen=id=>{const n=dcOf(id).filter(e=>e.kind==='nap');const l=n[n.length-1];return l&&l.value==='start'?l:null};
const prof=id=>(DB.test_child_profile||[]).find(p=>p.child_id===id)||{child_id:id};
const absentToday=(id,day=todayStr())=>(DB.test_absences||[]).find(a=>a.child_id===id&&a.day===day);
const kidById=id=>DB.test_children.find(c=>c.id===id)||{pseudonym:'?'};
function openKid(id){window._kid=id;window._ktab='dzien';go('dziecko')}
async function dcAdd(id,kind,value,note){closeM();const at=now().toISOString();track('daycard',kind);
  await Sync.upsert('test_daycard',{id:uid(),child_id:id,day:todayStr(),kind,value:value==null?null:String(value),note:note||null,at,by_code:S.code});toast('✓ '+DK[kind][0])}
function dcSheet(id,k){const c=kidById(id);const h=`<div class="arow"><div class="mki big">${IC[DK[k][1]]}</div><div class="h1s">${esc(c.pseudonym)} · ${DK[k][0]}</div></div>`;let b='';
  if(k==='meal')b=MEALS.map(([m,n])=>`<div class="mm">${n}</div><div class="bgrid">${PORT.map(([v,p,e])=>`<button class="b2 big2" onclick="dcAdd('${id}','meal','${m}:${v}')">${e} ${p}</button>`).join('')}</div>`).join('');
  else if(k==='nap'){const o=napOpen(id);b=o?`<div class="mm">Śpi od ${hm(o.at)}</div><button class="b1 big2" onclick="dcAdd('${id}','nap','end')">☀️ Obudziło się</button>`:`<button class="b1 big2" onclick="dcAdd('${id}','nap','start')">🌙 Zasnęło</button>`}
  else if(k==='toilet')b=`<div class="bgrid">${TOI.map(([v,n])=>`<button class="b2 big2" onclick="dcAdd('${id}','toilet','${v}')">${n}</button>`).join('')}</div>`;
  else if(k==='mood')b=`<div class="bgrid">${['h','n','s'].map(m=>`<button class="b2 big2" aria-label="${{h:'Wesoły',n:'Zwykły',s:'Smutny'}[m]}" onclick="dcAdd('${id}','mood','${m}')">${A.face[m]}</button>`).join('')}</div>`;
  else if(k==='temp')b=`<input id="dct" type="number" inputmode="decimal" step="0.1" min="34" max="42" value="36.6" style="font-size:28px;text-align:center"><button class="b1 big2" onclick="const v=parseFloat(dct.value.replace(',','.'));if(!(v>=34&&v<=42))return toast('34–42°C');dcAdd('${id}','temp',v.toFixed(1))">Zapisz</button>`;
  else if(k==='out')b=`<div class="bgrid">${[['ogrod','🌳 Ogród'],['spacer','🚶 Spacer'],['krotko','⏱ Krótko'],['nie','🏠 Zostało w sali']].map(([v,n])=>`<button class="b2 big2" onclick="dcAdd('${id}','out','${v}')">${n}</button>`).join('')}</div>`;
  else b=`<textarea id="dcn" rows="3" maxlength="500" placeholder="Krótka notatka dla rodzica" style="font-size:18px;width:100%"></textarea><button class="b1 big2" onclick="const v=dcn.value.trim();if(v)dcAdd('${id}','note',null,v)">Zapisz</button>`;
  sheet(h+b+`<button class="b2" onclick="closeM()">Anuluj</button>`)}
var dcLabel=e=>{const v=e.value||'';if(e.kind==='meal'){const [m,p]=v.split(':');return ((MEALS.find(x=>x[0]===m)||[,''])[1])+': '+((PORT.find(x=>x[0]===p)||[,'?'])[1])}
  if(e.kind==='nap')return v==='start'?'Zasnęło':'Obudziło się';if(e.kind==='toilet')return (TOI.find(x=>x[0]===v)||[,v])[1];if(e.kind==='mood')return {h:'Wesoły',n:'Zwykły',s:'Smutny'}[v]||v;
  if(e.kind==='temp')return v.replace('.',',')+'°C';if(e.kind==='out')return {ogrod:'Ogród',spacer:'Spacer',krotko:'Krótko na dworze',nie:'Zostało w sali'}[v]||v;return e.note||''};
function timeline(id,canDel){const c=kidById(id),s=state(c);const items=[];
  if(s.i)items.push({at:s.i.at,ic:IC.home,t:'Przyszło'+(s.i.mood?' '+({h:'😊',n:'😐',s:'😢'}[s.i.mood]):'')});if(s.o)items.push({at:s.o.at,ic:IC.home,t:'Odebrane'});
  (DB.test_outdoor||[]).filter(o=>o.day===todayStr()&&(o.child_ids||[]).includes(id)).forEach(o=>items.push({at:o.started_at,ic:IC.out,t:'Wyjście na dwór'}));
  evDay(id).forEach(e=>items.push({at:e.created_at,ic:IC.temp,t:(EVT[e.type]||EVT.inne)[0]+(e.note?' – '+e.note:'')}));
  dcOf(id).forEach(e=>items.push({at:e.at,ic:IC[DK[e.kind][1]],t:dcLabel(e)+(e.note&&e.kind!=='note'?' – '+e.note:''),id:e.id}));
  items.sort((a,b)=>a.at<b.at?-1:1);
  return items.length?`<div class="tl">${items.map(x=>`<div class="tli"><span class="tlt">${hm(x.at)}</span><span class="tlic">${x.ic}</span><span class="tlx">${esc(x.t)}</span>${canDel&&x.id?`<button class="tbtn" aria-label="Usuń wpis" onclick="Sync.remove('test_daycard','${x.id}')">✕</button>`:''}</div>`).join('')}</div>`:'<div class="muted">Jeszcze nic dziś.</div>'}
const mealSum=id=>MEALS.map(([m])=>{const e=dcOf(id).filter(x=>x.kind==='meal'&&x.value.startsWith(m+':')).pop();return e?(PORT.find(p=>p[0]===e.value.split(':')[1])||[])[2]||'·':'·'}).join('');
// --- media (Supabase Storage, private bucket) ---
const urlCache={};
async function mediaUrls(rows){if(!sb)return;const need=rows.filter(r=>!urlCache[r.path]);if(!need.length)return;
  const g=await sb.rpc('zl_media_grant',{tok:tok(),paths:need.map(r=>r.path),op:'read'});if(g.error||!(g.data||[]).length)return;
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(g.data,600);if(error){console.warn(error.message);return}
  (data||[]).forEach(d=>{if(d.signedUrl)urlCache[d.path]=d.signedUrl});render()}
function gallery(id,kind,canAdd){const rows=(DB.test_child_media||[]).filter(m=>m.child_id===id&&m.kind===kind).sort((a,b)=>a.created_at<b.created_at?1:-1);setTimeout(()=>mediaUrls(rows),0);
  const p=prof(id);const warn=kind==='foto'&&p.consent_image!=='tak'?`<div class="banner pz">⚠️ Brak zgody na wizerunek – zdjęcia tylko do dokumentacji wewnętrznej</div>`:'';
  return `${warn}${canAdd?`<label class="b1 big2 upl">${kind==='foto'?'📷 Zrób zdjęcie':'🎨 Dodaj pracę'}<input type="file" accept="image/*" capture="environment" hidden onchange="upMedia('${id}','${kind}',this)"></label>`:''}
  <div class="gal">${rows.map(r=>`<button class="gi" onclick="viewMedia('${r.id}')">${urlCache[r.path]?`<img src="${esc(urlCache[r.path])}" alt="${esc(r.caption||'')}" loading="lazy">`:'<span class="muted">…</span>'}<small>${esc(ld(r.created_at).slice(5).split('-').reverse().join('.'))}</small></button>`).join('')||`<div class="muted">${kind==='foto'?'Brak zdjęć.':'Brak prac.'}</div>`}</div>`}
function viewMedia(mid){const r=DB.test_child_media.find(x=>x.id===mid);if(!r)return;sheet(`${urlCache[r.path]?`<img src="${esc(urlCache[r.path])}" style="width:100%;border-radius:16px">`:''}<div class="mm">${esc(r.caption||'')}</div>${!isPar()&&!isGuest()?`<button class="b2" onclick="delMedia('${mid}')">🗑 Usuń</button>`:''}<button class="b1" onclick="closeM()">Zamknij</button>`)}
async function delMedia(mid){const r=DB.test_child_media.find(x=>x.id===mid);closeM();if(sb){const g=await sb.rpc('zl_media_grant',{tok:tok(),paths:[r.path],op:'delete'});if(!g.error&&(g.data||[]).length)await sb.storage.from(BUCKET).remove(g.data)}await Sync.remove('test_child_media',mid)}
async function shrink(file){const img=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
async function upMedia(id,kind,inp){const f=inp.files&&inp.files[0];if(!f)return;if(!sb)return toast('Brak połączenia');
  if(kind==='foto'&&prof(id).consent_image!=='tak'&&!confirm('Brak zgody RODO na wizerunek. Zapisać tylko do dokumentacji?'))return;
  toast('Wysyłanie…');let blob;try{blob=await shrink(f)}catch(e){blob=f}const pr=await sb.rpc('zl_media_upload_path',{tok:tok(),child:id,kind});const path=pr.data;if(pr.error||!path)return toast('Brak uprawnień do dodania zdjęcia');
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error)return toast(/bucket|not found|policy|row-level/i.test(error.message)?'Zdjęcia: czeka na aktualizację bazy':'Błąd: '+error.message);
  await Sync.upsert('test_child_media',{id:uid(),child_id:id,kind,path,caption:null,by_code:S.code,created_at:new Date().toISOString()});track('media_add',kind);toast('Dodano ✓')}
function profForm(id){const p=prof(id),c=kidById(id);sheet(`<div class="arow"><div class="mki big">${IC.diet}</div><div class="h1s">${esc(c.pseudonym)} · dieta i zgody</div></div>
 <label class="mm" for="pd">Dieta</label><input id="pd" value="${esc(p.diet||'')}" placeholder="np. bezmleczna, wegetariańska">
 <label class="mm" for="pa">Alergie</label><input id="pa" value="${esc(p.allergies||'')}" placeholder="np. orzechy, jajka">
 <div class="mm">Zgoda na wizerunek (RODO)</div><div class="swg">${[['tak','✅ Tak'],['wew','🔒 Tylko wewn.'],['nie','⛔ Nie']].map(([v,n])=>`<label class="chk"><input type="radio" name="pc" value="${v}" ${(p.consent_image||'nie')===v?'checked':''}>${n}</label>`).join('')}</div>
 <input id="pn" value="${esc(p.consent_note||'')}" placeholder="Uwagi do zgody (data, zakres)">
 <button class="b1" onclick="saveProf('${id}')">Zapisz</button><button class="b2" onclick="closeM()">Anuluj</button>`)}
async function saveProf(id){const p=prof(id);const r={...p,child_id:id,diet:pd.value.trim()||null,allergies:pa.value.trim()||null,consent_image:(document.querySelector('[name=pc]:checked')||{}).value||'nie',consent_note:pn.value.trim()||null,updated_at:new Date().toISOString()};closeM();await Sync.upsert('test_child_profile',r);toast('Zapisano')}
function kidTabs(id,tabs){const t=window._ktab||tabs[0][0];return `<div class="ktabs">${tabs.map(([k,n,ic])=>`<button class="ktb ${t===k?'on':''}" onclick="window._ktab='${k}';render()"><span class="kti">${IC[ic]}</span>${n}</button>`).join('')}</div>`}
SCR.karta=()=>{const g=myGrp();const ks=kids(g);
  return ['Karty dnia','',`${pendSQL()}${gsw(false)}<div class="kgrid">${ks.map(c=>{const s=state(c),ab=absentToday(c.id),n=napOpen(c.id),p=prof(c.id);
   return `<button class="card kc ${s.present?'':'off'}" onclick="openKid('${c.id}')"><span class="kini">${esc(c.pseudonym[0])}</span><b class="kn">${esc(c.pseudonym)}</b><span class="kst">${ab&&!s.i?'🏠 nieobecne':s.present?(n?'🌙 śpi':'✓ jest'):s.o?'👋 odebrane':'—'}</span><span class="kml">${mealSum(c.id)}</span>${p.allergies?'<span class="alg">⚠️ alergia</span>':''}</button>`}).join('')||'<div class="muted">Brak dzieci.</div>'}</div>`]};

  if(t==='dzien')b+=`<div class="qgrid">${Object.keys(DK).map(k=>`<button class="qt" onclick="dcSheet('${id}','${k}')">${IC[DK[k][1]]}<b>${k==='nap'&&napOpen(id)?'Pobudka':DK[k][0]}</b></button>`).join('')}</div><div class="sec2">Oś dnia</div>${timeline(id,true)}`;
  else if(t==='foto')b+=gallery(id,'foto',true);else if(t==='prace')b+=gallery(id,'praca',true);
  else b+=`<div class="card"><div class="h1s">🥗 Dieta</div><div class="mm">${esc(p.diet||'zwykła')}</div><div class="h1s">⚠️ Alergie</div><div class="mm">${esc(p.allergies||'brak')}</div><div class="h1s">📸 Zgoda RODO</div><div class="mm">${{tak:'✅ Tak – wizerunek',wew:'🔒 Tylko dokumentacja wewnętrzna',nie:'⛔ Brak zgody'}[p.consent_image||'nie']}${p.consent_note?' · '+esc(p.consent_note):''}</div><button class="b1" onclick="profForm('${id}')">✏️ Zmień</button></div><div class="muted">Zgody RODO: wymagane pisemne oświadczenie rodzica; tu tylko notatka.</div>`;
  return [esc(c.pseudonym),`<button class="tbtn" aria-label="Wróć" onclick="go('karta')">‹</button>`,b]};

// Informacje prawne – SZKIC, NIEAKTYWNE (tylko podgląd admina, brak linku w stopce)
const LEGAL_HTML="<h2>Informacje prawne – Tuptuś (SZKIC, NIEAKTYWNE)<\/h2><div class=\"hint\"><b>SZKIC – wymaga weryfikacji przez prawnika przed publikacją. Dokument nie jest obowiązujący.<\/b><\/div><h3>1. Dane właściciela aplikacji<\/h3><ul><li>Nazwa: Wydawnictwo Malachi<\/li><li>Adres: [do uzupełnienia]<\/li><li>E-mail: [do uzupełnienia]<\/li><li>NIP / KVK: [do uzupełnienia]<\/li><\/ul><h3>2. Regulamin świadczenia usług drogą elektroniczną<\/h3><p>Regulamin określony na podstawie art. 8 ustawy z dnia 18 lipca 2002 r. o świadczeniu usług drogą elektroniczną.<\/p><h4>2.1. Postanowienia ogólne<\/h4><ol><li>Usługodawcą jest Wydawnictwo Malachi (dane w pkt 1).<\/li><li>Aplikacja Tuptuś jest narzędziem dla żłobków i klubów dziecięcych wspierającym codzienną pracę personelu i kontakt z rodzicami.<\/li><li>Usługobiorcami są żłobki (podmioty prowadzące), ich personel oraz rodzice/opiekunowie prawni dzieci, którym żłobek nadał dostęp.<\/li><\/ol><h4>2.2. Rodzaje i zakres usług<\/h4><ol><li>Prowadzenie konta użytkownika (personel, dyrekcja, rodzic).<\/li><li>Ewidencja obecności, karty dnia, wyjścia na dwór, jadłospis i informacje dla kuchni.<\/li><li>Komunikator między personelem oraz między żłobkiem a rodzicami.<\/li><li>Materiały edukacyjne (lekcje, piosenki, słuchowiska, linki).<\/li><li>Formularz uwag i zgłoszeń do usługodawcy.<\/li><\/ol><h4>2.3. Wymagania techniczne<\/h4><ol><li>Urządzenie z dostępem do Internetu i aktualną przeglądarką (Chrome, Safari, Firefox, Edge – dwie ostatnie wersje) z włączonym JavaScript i pamięcią lokalną (localStorage).<\/li><li>Aktywne konto nadane przez żłobek lub usługodawcę.<\/li><li>Zalecane połączenie szyfrowane (HTTPS – zapewnia usługodawca).<\/li><\/ol><h4>2.4. Zakaz dostarczania treści o charakterze bezprawnym<\/h4><p>Usługobiorca nie może dostarczać treści o charakterze bezprawnym, w szczególności naruszających dobra osobiste, prawa autorskie, przepisy o ochronie danych osobowych lub dobre obyczaje, ani treści dotyczących dzieci wykraczających poza cel korzystania z aplikacji.<\/p><h4>2.5. Warunki zawierania i rozwiązywania umów<\/h4><ol><li>Umowę o świadczenie usług ze żłobkiem zawiera się w formie [do uzupełnienia: pisemnej / elektronicznej], na czas [do uzupełnienia].<\/li><li>Konta personelu i rodziców tworzy żłobek; umowa z użytkownikiem zostaje zawarta z chwilą pierwszego logowania i akceptacji regulaminu.<\/li><li>Użytkownik może w każdej chwili zrezygnować z usługi, zgłaszając to żłobkowi lub usługodawcy. Żłobek może rozwiązać umowę z zachowaniem okresu wypowiedzenia [do uzupełnienia].<\/li><li>Usługodawca może zablokować konto w razie naruszenia regulaminu, w szczególności pkt 2.4.<\/li><\/ol><h4>2.6. Tryb postępowania reklamacyjnego<\/h4><ol><li>Reklamacje można składać e-mailem na adres [do uzupełnienia] lub przez formularz „Uwagi” w aplikacji.<\/li><li>Reklamacja powinna zawierać: dane zgłaszającego, opis problemu, datę wystąpienia.<\/li><li>Usługodawca rozpatruje reklamację w terminie 14 dni od jej otrzymania i odpowiada w tej samej formie, w jakiej ją złożono.<\/li><\/ol><h4>2.7. Postanowienia końcowe<\/h4><p>Regulamin jest udostępniany nieodpłatnie w aplikacji w sposób umożliwiający jego pobranie, utrwalenie i wydrukowanie. Zmiany regulaminu będą ogłaszane z wyprzedzeniem [do uzupełnienia] dni.<\/p><h3>3. Polityka prywatności (RODO) – dane dzieci<\/h3><h4>3.1. Role stron<\/h4><ol><li><b>Administratorem<\/b> danych dzieci, rodziców i personelu jest żłobek (podmiot prowadzący), który korzysta z aplikacji.<\/li><li><b>Podmiotem przetwarzającym<\/b> jest Wydawnictwo Malachi, przetwarzające dane wyłącznie na udokumentowane polecenie administratora na podstawie <b>umowy powierzenia przetwarzania danych (art. 28 RODO)<\/b> zawieranej z każdym żłobkiem.<\/li><li>W zakresie danych kont personelu na potrzeby obsługi technicznej i zgłoszeń Wydawnictwo Malachi może być odrębnym administratorem – [do weryfikacji prawnej].<\/li><\/ol><h4>3.2. Cele i podstawy prawne przetwarzania (określa administrator – żłobek)<\/h4><ol><li>Realizacja opieki nad dzieckiem i obowiązków ustawy o opiece nad dziećmi w wieku do lat 3 – art. 6 ust. 1 lit. b, c RODO.<\/li><li>Ewidencja obecności, odbiorów i kontakt z rodzicami – art. 6 ust. 1 lit. b, c, e RODO.<\/li><li>Informacje o diecie, alergiach i zdrowiu (dane szczególnej kategorii) – art. 9 ust. 2 lit. a (wyraźna zgoda rodzica) lub lit. h/b w zakresie wynikającym z przepisów – [do weryfikacji prawnej].<\/li><li>Obsługa zgłoszeń i bezpieczeństwo systemu – art. 6 ust. 1 lit. f RODO.<\/li><\/ol><h4>3.3. Dane dzieci – uwagi szczególne<\/h4><ol><li>Dzieci nie zakładają kont; dane dzieci wprowadza żłobek, a zgody udzielają rodzice/opiekunowie prawni (art. 8 RODO dotyczy usług społeczeństwa informacyjnego kierowanych bezpośrednio do dzieci – tutaj usługa kierowana jest do dorosłych).<\/li><li>Dane o zdrowiu, alergiach i diecie stanowią dane szczególnej kategorii (art. 9 RODO) i są dostępne wyłącznie upoważnionym osobom.<\/li><li>Zasada minimalizacji: aplikacja domyślnie posługuje się <b>pseudonimami<\/b> dzieci; prawdziwe imiona są wyświetlane wyłącznie po włączeniu przez żłobek.<\/li><li>Nie stosuje się profilowania ani zautomatyzowanego podejmowania decyzji wobec dzieci.<\/li><\/ol><h4>3.4. Odbiorcy danych<\/h4><ol><li>Supabase (hosting bazy danych i uwierzytelniania) – serwery w regionie UE; dostawca jako dalszy podmiot przetwarzający.<\/li><li>GitHub Pages (hosting plików aplikacji – bez danych osobowych dzieci).<\/li><li>Usługa przekazywania formularzy e-mail (formsubmit.co) – wyłącznie treść uwag do aplikacji [do weryfikacji, transfer poza EOG].<\/li><li>Organy publiczne – wyłącznie gdy wymagają tego przepisy.<\/li><\/ol><h4>3.5. Okres przechowywania<\/h4><p>Dane przechowywane są przez czas uczęszczania dziecka do żłobka oraz okres wymagany przepisami [do uzupełnienia], a następnie usuwane lub anonimizowane. Po zakończeniu umowy powierzenia dane są zwracane administratorowi lub usuwane w terminie [do uzupełnienia] dni.<\/p><h4>3.6. Prawa osób, których dane dotyczą<\/h4><p>Prawo dostępu, sprostowania, usunięcia, ograniczenia przetwarzania, przenoszenia danych, sprzeciwu, cofnięcia zgody w dowolnym momencie (bez wpływu na zgodność z prawem wcześniejszego przetwarzania) oraz skargi do Prezesa UODO. Wnioski należy kierować do administratora (żłobka).<\/p><h4>3.7. Inspektor Ochrony Danych<\/h4><p>IOD żłobka: [do uzupełnienia]. Kontakt w sprawach powierzenia u Wydawnictwa Malachi: [do uzupełnienia].<\/p><h4>3.8. Środki bezpieczeństwa<\/h4><ol><li>Szyfrowanie transmisji (HTTPS/TLS), dostęp do danych tylko przez kontrolowane funkcje RPC z tokenem sesji.<\/li><li>Role i uprawnienia (opiekunka, dyrektor, admin) oraz zasada najmniejszych uprawnień.<\/li><li>Pseudonimizacja danych dzieci, rejestr zmian, polityka bezpieczeństwa treści (CSP).<\/li><li>Kopie zapasowe i procedura zgłaszania naruszeń (72 h do UODO – obowiązek administratora, wspierany przez podmiot przetwarzający).<\/li><\/ol>";

// ==== DIETA (multi-select, rodzic) + uprawnienia do dzieci ====
const DIETS_MAIN=['koszerna','halal','wegetariańska','wegańska'];
const DIETS_MORE=['bezglutenowa (celiakia)','bezlaktozowa','bez białka mleka krowiego (BMK)','bezjajeczna','bez orzechów / orzeszków ziemnych','bez ryb i owoców morza','niskobiałkowa (np. fenyloketonuria)','wysokokaloryczna / wysokowęglowodanowa','ketogeniczna (medyczna)','bezcukrowa / cukrzyca','low-FODMAP','lekkostrawna'];
const DIETS_ALL=[...DIETS_MAIN,...DIETS_MORE];
const dietParse=s=>{const o={sel:[],other:''};String(s||'').split(/,\s*(?=[^,]*$|)/);String(s||'').split(', ').forEach(x=>{x=x.trim();if(!x)return;if(x.startsWith('inna: '))o.other=x.slice(6);else if(DIETS_ALL.includes(x))o.sel.push(x);else o.other=o.other?o.other+', '+x:x});return o};
const dietJoin=(sel,other)=>{const a=DIETS_ALL.filter(d=>sel.includes(d));if(other)a.push('inna: '+other.replace(/,/g,';'));return a.join(', ')||null};
const DIET_LS='zl_diet_local';const dietLocal=()=>{try{return JSON.parse(localStorage.getItem(DIET_LS)||'{}')}catch(e){return {}}};
const pChildId=()=>{const c=P&&P.child;return c&&(c.id||c.child_id)||null};
const pDietVal=()=>{const id=pChildId(),l=dietLocal();if(id&&l[id]!==undefined)return l[id];const c=P&&P.child;return c&&c.diet||((DB.test_child_profile||[]).find(p=>p.child_id===id)||{}).diet||null};
function dietSheet(){const v=dietParse(pDietVal());const more=window._dietMore||v.sel.some(d=>DIETS_MORE.includes(d));
  const box=d=>`<label class="chk"><input type="checkbox" name="pdiet" value="${esc(d)}" ${v.sel.includes(d)?'checked':''}>${esc(d)}</label>`;
  sheet(`<div class="h1s">🥗 Dieta dziecka</div><div class="mm">Można wybrać kilka.</div><div class="swg">${DIETS_MAIN.map(box).join('')}</div>
  <div class="swg" id="dmore" style="${more?'':'display:none'}">${DIETS_MORE.map(box).join('')}</div>
  <button class="b2" id="dtog" onclick="dietTog()">${more?'Mniej ▴':'Więcej diet ▾'}</button>
  <label class="mm" for="pdo">Inna (opis)</label><input id="pdo" maxlength="200" value="${esc(v.other)}" placeholder="np. bez truskawek, bez wieprzowiny">
  <button class="b1" onclick="dietSave()">Zapisz</button><button class="b2" onclick="closeM()">Anuluj</button>`)}
function dietTog(){const m=document.getElementById('dmore'),b=document.getElementById('dtog');const hid=m.style.display==='none';
  if(!hid&&[...m.querySelectorAll('input:checked')].length)return toast('Zaznaczone diety pozostają widoczne');m.style.display=hid?'':'none';b.textContent=hid?'Mniej ▴':'Więcej diet ▾';window._dietMore=hid}
async function dietSave(){const id=pChildId();if(!id)return toast('Brak dziecka');const sel=[...document.querySelectorAll('[name=pdiet]:checked')].map(x=>x.value);const val=dietJoin(sel,document.getElementById('pdo').value.trim());closeM();
  const l=dietLocal();l[id]=val;localStorage.setItem(DIET_LS,JSON.stringify(l));let ok=false;
  if(sb&&tok()){const {error}=await sb.rpc('zl_upsert',{tok:tok(),t:'test_child_profile',r:{child_id:id,diet:val,updated_at:new Date().toISOString()}});ok=!error;if(error){console.warn('dieta',error.message);const r2=await sb.rpc('parent_set_diet',{tok:tok(),diet:val});ok=!r2.error&&r2.data!==false}}
  if(ok){delete l[id];localStorage.setItem(DIET_LS,JSON.stringify(l));if(P.child)P.child.diet=val}
  toast(ok?'Zapisano dietę ✓':'Zapisano lokalnie (baza nie przyjęła zapisu rodzica)');render()}
